name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      # Keep tag builds on the same exact lockfile contract as pull requests and main.
      - name: Pin npm
        run: npm install -g npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package extension
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd chrome-extension
          zip -r "../libby-downloader-extension-$RELEASE_TAG.zip" . -x ".*"
          cd ..

      - name: Extract release notes from CHANGELOG.md
        id: notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="$RELEASE_TAG"
          VERSION="${VERSION#v}"
          awk -v ver="$VERSION" '
            /^## / { if (found) exit; if (index($0, ver)) found=1; next }
            found { print }
          ' CHANGELOG.md > release-notes.md

      - name: Create GitHub Release
        run: |
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md \
            "libby-downloader-extension-$RELEASE_TAG.zip"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
